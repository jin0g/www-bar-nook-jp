    <main id="top">

        <img src="/images/hero-bar-nook.png" alt="琥珀色の灯りがともる静かなバーカウンター">
        <div class="hero-shade"></div>
        <div class="hero-copy">
          <h1 id="hero-title">三宮、宵町バー巡り。</h1>
          <p>まだ知らないバーへ。<br>あなたもバーホッパーになる。</p>
        </div>
        <span class="scroll-cue">SCROLL</span>
      </section>

      <section class="operators" aria-labelledby="operators-title">

        </div>
        <div class="operator-grid">
          <a class="operator-card operator-tea" href="#footer">
            <img src="/images/operator-tea-mock.png" alt="明るいジンバーの店内">
            <span class="operator-shade"></span>
            <span class="operator-copy"><strong>TeA Mock</strong><small>IMAGE &amp; CREATE</small></span>
          </a>
          <a class="operator-card operator-asterisk" href="#footer">
            <img src="/images/operator-asterisk.png" alt="天の川が広がる星空">
            <span class="operator-shade"></span>
            <span class="operator-copy"><strong>Asterisk</strong><small>DESIGN &amp; SYSTEM</small></span>
          </a>
        </div>
      </section>

      <section class="bar-section" id="bars" aria-labelledby="bars-title">

        </div>
        <div class="search-panel" hidden>
          <label for="bar-search">店名・雰囲気・エリアから探す</label>
          <div class="search-controls">
            <input id="bar-search" type="search" placeholder="例：ウイスキー、静か、北野坂">
            <button class="sort-button" type="button" aria-disabled="true">並び替え</button>
          </div>
        </div>
        <div class="bar-grid" aria-live="polite"></div>
        <p class="empty-message" hidden>条件に合うバーが見つかりませんでした</p>
      </section>
    </main>

    <footer id="footer">
      <a class="footer-logo" href="#top">BAR NOOK</a>
      <p>三宮、宵町バー巡り。</p>
      <small>掲載店舗はすべて架空です</small>
    </footer>
